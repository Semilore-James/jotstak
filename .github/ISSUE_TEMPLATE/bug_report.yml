name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. A small `.jot` snippet that reproduces the problem is the most useful thing you can include.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal .jot source
      description: The smallest document that shows the problem.
      render: text
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      options:
        - Web playground
        - VS Code extension
        - Exported HTML
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and browser or editor version.
      placeholder: Windows 11, Chrome 141
