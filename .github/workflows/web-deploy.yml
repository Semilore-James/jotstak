name: Deploy web to Cloudflare Pages

# Manual-only until M1: the Cloudflare Pages project and the CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID secrets don't exist yet, so a push trigger would fail on
# every commit. At M1, restore:
#   push: { branches: [main], paths: ["apps/web/**", "packages/renderer/**", "packages/schema/**"] }
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @jotstak/web
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=jotstak
